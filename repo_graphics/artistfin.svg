<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <style>
      .base { fill: #04a5e5; } /* Updated from salmon */
      .base-shadow { fill: #0384c1; } /* Darker shade of new blue for shadow */
      .symbol { fill: #ffffff; }
      .badge-bg { fill: #40a02b; } /* Updated from teal */
      .badge-symbol { fill: #ffffff; }
    </style>
  </defs>

  <!-- baseplate shadow / bottom lip -->
  <rect class="base-shadow" width="40" height="40" x="4" y="5" rx="4" />

  <!-- main baseplate -->
  <rect class="base" width="40" height="40" x="4" y="4" rx="4" />

  <!-- jellyfin logo -->
  <path class="symbol" opacity="0.95" d="M 24 10 C 20.19 10 7.92 32.24 9.79 36 C 11.66 39.75 36.36 39.71 38.21 36 C 40.25 32.29 27.81 10 24 10 Z M 33.31 32.74 C 32.1 35.17 15.92 35.2 14.69 32.74 C 13.46 30.28 21.5 15.71 24 15.71 C 26.5 15.71 34.52 30.31 33.31 32.74 Z M 24 21.04 C 22.74 21.04 18.66 28.42 19.28 29.67 C 19.9 30.92 28.1 30.9 28.71 29.67 C 29.32 28.44 25.26 21.04 24 21.04 Z" />

  <!-- person badge -->
  <g id="person-tag">
    <rect class="badge-bg" width="14" height="14" x="28" y="28" rx="2.5" />
    <!-- head -->
    <circle class="badge-symbol" cx="35" cy="32.2" r="1.8" />
    <!-- body -->
    <path class="badge-symbol" d="M 35 34.8 C 32.8 34.8 31.5 36.1 31.5 37.5 C 31.5 37.8 31.7 38 32 38 H 38 C 38.3 38 38.5 37.8 38.5 37.5 C 38.5 36.1 37.2 34.8 35 34.8 Z" />
  </g>
</svg>
